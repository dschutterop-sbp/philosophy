name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The scan only reads repository contents. It receives no deployment credentials.
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Detect committed credentials
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository and history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Complements pattern-based Gitleaks detection with TruffleHog's
      # provider-aware detectors and verification when a detector supports it.
      - name: Scan checked-out source with TruffleHog
        uses: trufflesecurity/trufflehog@v3.95.2
        with:
          path: ./
