<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 528" role="img" aria-label="The approval bundle as one hash-bound unit">
<style>
text{font-family:'Helvetica Neue',Arial,sans-serif}
.th{font-weight:500;font-size:14px;fill:#2C2C2A}.ts{font-weight:400;font-size:12px;fill:#5F5E5A}
.box{fill:#FFFFFF;stroke:#B4B2A9;stroke-width:0.5}
.teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}.coral{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.amber{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.5}
.teal-th{font-weight:500;font-size:14px;fill:#085041}.teal-ts{font-weight:400;font-size:12px;fill:#0F6E56}
.coral-th{font-weight:500;font-size:14px;fill:#712B13}.coral-ts{font-weight:400;font-size:12px;fill:#993C1D}
.amber-t{font-weight:400;font-size:14px;fill:#633806}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="teal" x="120" y="50" width="440" height="100" rx="8"/><text class="teal-th" x="340" y="72" text-anchor="middle" dominant-baseline="central">Approval bundle: bound state</text><text class="teal-ts" x="340" y="96" text-anchor="middle" dominant-baseline="central">context · philosophy · strategy · interpretation</text><text class="teal-ts" x="340" y="114" text-anchor="middle" dominant-baseline="central">direction · skill · template · artefact payload</text><text class="teal-ts" x="340" y="132" text-anchor="middle" dominant-baseline="central">validation · conformance · destination · adapter</text>
<line class="arr" x1="340" y1="150" x2="340" y2="178" marker-end="url(#a)"/>
<rect class="box" x="180" y="180" width="320" height="56" rx="8"/><text class="th" x="340" y="200" text-anchor="middle" dominant-baseline="central">Canonical hash and signing</text><text class="ts" x="340" y="218" text-anchor="middle" dominant-baseline="central">One signed unit</text>
<line class="arr" x1="340" y1="236" x2="340" y2="264" marker-end="url(#a)"/>
<rect class="coral" x="180" y="266" width="320" height="56" rx="8"/><text class="coral-th" x="340" y="286" text-anchor="middle" dominant-baseline="central">Approval token</text><text class="coral-ts" x="340" y="304" text-anchor="middle" dominant-baseline="central">Authorises one exact payload</text>
<line class="arr" x1="340" y1="322" x2="340" y2="350" marker-end="url(#a)"/>
<rect class="box" x="180" y="352" width="320" height="56" rx="8"/><text class="th" x="340" y="372" text-anchor="middle" dominant-baseline="central">Publication adapter</text><text class="ts" x="340" y="390" text-anchor="middle" dominant-baseline="central">Verifies signature, expiry, hash</text>
<path d="M158 466 V294 H176" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
<rect class="amber" x="180" y="444" width="380" height="44" rx="8"/><text class="amber-t" x="370" y="466" text-anchor="middle" dominant-baseline="central">Changing any bound entity invalidates the token</text>
</svg>
