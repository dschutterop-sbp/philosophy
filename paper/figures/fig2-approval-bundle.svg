<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 650" role="img" aria-label="Exact-state approval bundle, signed token, and publication adapter checks">
<style>
text{font-family:'Helvetica Neue',Arial,sans-serif}.th{font-weight:500;font-size:14px;fill:#2C2C2A}.ts{font-weight:400;font-size:11.5px;fill:#5F5E5A}.tiny{font-weight:400;font-size:10.5px;fill:#5F5E5A}
.box{fill:#FFFFFF;stroke:#B4B2A9;stroke-width:.7}.teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}.coral{fill:#FAECE7;stroke:#993C1D;stroke-width:1}.amber{fill:#FAEEDA;stroke:#854F0B;stroke-width:1}
.teal-th{font-weight:500;font-size:14px;fill:#085041}.teal-ts{font-weight:400;font-size:11.5px;fill:#0F6E56}.coral-th{font-weight:500;font-size:14px;fill:#712B13}.coral-ts{font-weight:400;font-size:11.5px;fill:#993C1D}.amber-t{font-weight:500;font-size:12px;fill:#633806}.arr{stroke:#5F5E5A;stroke-width:1.35;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="teal" x="70" y="24" width="540" height="176" rx="8"/>
<text class="teal-th" x="340" y="45" text-anchor="middle" dominant-baseline="central">1. Approval bundle: the exact reviewed state</text>
<line x1="70" y1="61" x2="610" y2="61" stroke="#0F6E56" stroke-width=".5" stroke-opacity=".4"/>
<text class="teal-ts" x="100" y="80">Evidence and rationale</text><text class="tiny" x="100" y="97">context snapshot · Philosophy · Strategy · interpretation</text><text class="tiny" x="100" y="113">early-checkpoint review · selected direction</text>
<text class="teal-ts" x="365" y="80">Execution and checks</text><text class="tiny" x="365" y="97">Skill · template · artefact payload</text><text class="tiny" x="365" y="113">validation report · conformance report</text>
<text class="teal-ts" x="100" y="140">Submission intent</text><text class="tiny" x="100" y="157">destination · publication_intent_id · submission policy</text><text class="tiny" x="100" y="173">idempotency key · scheduled time · adapter version</text>
<text class="teal-ts" x="365" y="140">Approval authority and lifetime</text><text class="tiny" x="365" y="157">approver identity and role · approved_at</text><text class="tiny" x="365" y="173">expiry · schema and approval identifiers</text>

<line class="arr" x1="340" y1="200" x2="340" y2="224" marker-end="url(#a)"/>
<rect class="box" x="150" y="226" width="380" height="60" rx="8"/><text class="th" x="340" y="246" text-anchor="middle" dominant-baseline="central">2. Canonicalise, hash, and sign the bundle</text><text class="ts" x="340" y="267" text-anchor="middle" dominant-baseline="central">approval_token = sign(canonical_hash(approval_bundle))</text>
<line class="arr" x1="340" y1="286" x2="340" y2="310" marker-end="url(#a)"/>
<rect class="coral" x="150" y="312" width="380" height="60" rx="8"/><text class="coral-th" x="340" y="332" text-anchor="middle" dominant-baseline="central">3. Approval token</text><text class="coral-ts" x="340" y="353" text-anchor="middle" dominant-baseline="central">Authorises one exact intent for one exact payload</text>
<line class="arr" x1="340" y1="372" x2="340" y2="396" marker-end="url(#a)"/>
<rect class="box" x="90" y="398" width="500" height="116" rx="8"/><text class="th" x="340" y="418" text-anchor="middle" dominant-baseline="central">4. Publication Adapter verifies before submission</text>
<text class="ts" x="120" y="443">signature · expiry · destination · adapter version</text><text class="ts" x="120" y="463">recomputed payload hash · authenticated time ≥ scheduled time</text><text class="ts" x="120" y="483">atomically claim the intent: unused → claimed → terminal</text><text class="ts" x="120" y="503">then record claim, request ID, submitted hash, time, and receipt</text>

<path d="M68 580V342H146" fill="none" stroke="#854F0B" stroke-width=".8" stroke-dasharray="4 3" marker-end="url(#a)"/>
<rect class="amber" x="110" y="548" width="460" height="68" rx="8"/><text class="amber-t" x="340" y="568" text-anchor="middle" dominant-baseline="central">Any bound change invalidates the token</text><text class="tiny" x="340" y="588" text-anchor="middle" dominant-baseline="central">Changed evidence, review, direction, payload, check, destination,</text><text class="tiny" x="340" y="603" text-anchor="middle" dominant-baseline="central">timing, policy, or adapter version requires a new approval.</text>
</svg>
