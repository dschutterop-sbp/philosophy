<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 462" role="img" aria-label="Hard admissibility boundaries versus preference ordering">
<style>
text{font-family:'Helvetica Neue',Arial,sans-serif}
.ts{font-weight:400;font-size:12px;fill:#5F5E5A}
.coral{fill:#FAECE7;stroke:#993C1D;stroke-width:1}.teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.coral-th{font-weight:500;font-size:14px;fill:#712B13}.coral-t{font-weight:400;font-size:14px;fill:#712B13}
.teal-th{font-weight:500;font-size:14px;fill:#085041}.teal-t{font-weight:400;font-size:14px;fill:#085041}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="coral" x="90" y="50" width="500" height="154" rx="8"/>
<text class="coral-th" x="110" y="70" dominant-baseline="central">Hard admissibility — defines the valid space</text>
<line x1="90" y1="86" x2="590" y2="86" stroke="#993C1D" stroke-width="0.5" stroke-opacity="0.4"/>
<text class="coral-t" x="110" y="101" dominant-baseline="central">1   Safety, law, non-overridable governance</text>
<text class="coral-t" x="110" y="131" dominant-baseline="central">2   Verified context constraints</text>
<text class="coral-t" x="110" y="160" dominant-baseline="central">3   Hard Skill constraints (security, integrity)</text>
<text class="coral-t" x="110" y="189" dominant-baseline="central">4   Philosophy invariants and prohibitions</text>
<line class="arr" x1="340" y1="204" x2="340" y2="236" marker-end="url(#a)"/>
<text class="ts" x="360" y="220" dominant-baseline="central">Preferences rank only within this space</text>
<rect class="teal" x="90" y="238" width="500" height="184" rx="8"/>
<text class="teal-th" x="110" y="258" dominant-baseline="central">Preference ordering — ranks admissible options</text>
<line x1="90" y1="274" x2="590" y2="274" stroke="#0F6E56" stroke-width="0.5" stroke-opacity="0.4"/>
<text class="teal-t" x="110" y="289" dominant-baseline="central">1   Authorised human instruction</text>
<text class="teal-t" x="110" y="318" dominant-baseline="central">2   Overrideable Skill defaults</text>
<text class="teal-t" x="110" y="348" dominant-baseline="central">3   Time-bounded Strategy objectives</text>
<text class="teal-t" x="110" y="378" dominant-baseline="central">4   Philosophy defaults and preferences</text>
<text class="teal-t" x="110" y="407" dominant-baseline="central">5   Model creativity</text>
</svg>
